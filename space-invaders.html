<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #0f0;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 3px solid #0f0;
      box-shadow: 0 0 20px #0f0, inset 0 0 20px rgba(0, 255, 0, 0.1);
    }
    canvas {
      display: block;
      background: #000;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      pointer-events: none;
      text-shadow: 0 0 5px #0f0;
    }
    #game-over {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
    }
    #game-over h1 {
      font-size: 48px;
      color: #f00;
      text-shadow: 0 0 15px #f00;
      margin-bottom: 20px;
    }
    #menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 20;
    }
    #menu h1 {
      font-size: 52px;
      color: #0f0;
      text-shadow: 0 0 20px #0f0;
      margin-bottom: 15px;
      letter-spacing: 4px;
    }
    #menu p {
      font-size: 16px;
      color: #0a0;
      margin-bottom: 30px;
      line-height: 1.8;
    }
    .menu-btn {
      padding: 14px 40px;
      font-size: 20px;
      font-family: 'Courier New', monospace;
      background: #000;
      color: #0f0;
      border: 2px solid #0f0;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .menu-btn:hover {
      background: #0f0;
      color: #000;
      box-shadow: 0 0 15px #0f0;
    }
    #game-over p {
      font-size: 22px;
      margin-bottom: 30px;
    }
    #restart-btn {
      padding: 12px 30px;
      font-size: 18px;
      font-family: 'Courier New', monospace;
      background: #000;
      color: #0f0;
      border: 2px solid #0f0;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    #restart-btn:hover {
      background: #0f0;
      color: #000;
      box-shadow: 0 0 15px #0f0;
    }
    .instructions {
      position: absolute;
      bottom: -40px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      color: #0a0;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="700"></canvas>
    <div id="ui">
      <div>Pontuação: <span id="score">0</span></div>
      <div>Nível: <span id="level">1</span></div>
    </div>
    <div id="menu">
      <h1>SPACE INVADERS</h1>
      <p>← → Mover a nave<br>Espaço para atirar<br>Destrua todos os invasores!</p>
      <button id="start-btn" class="menu-btn">Iniciar Jogo</button>
    </div>
    <div id="game-over">
      <h1>GAME OVER</h1>
      <p>Pontuação final: <span id="final-score">0</span></p>
      <button id="restart-btn" class="menu-btn">Jogar Novamente</button>
      <button id="menu-btn" class="menu-btn">Menu Principal</button>
    </div>
    <div class="instructions">← → Mover | Espaço Atirar</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const menuScreen = document.getElementById('menu');
    const startBtn = document.getElementById('start-btn');
    const menuBtn = document.getElementById('menu-btn');

    // Configurações
    const PLAYER_WIDTH = 40;
    const PLAYER_HEIGHT = 30;
    const PLAYER_SPEED = 6;
    const BULLET_WIDTH = 4;
    const BULLET_HEIGHT = 12;
    const BULLET_SPEED = 8;
    const ENEMY_ROWS = 4;
    const ENEMY_COLS = 8;
    const ENEMY_WIDTH = 35;
    const ENEMY_HEIGHT = 25;
    const ENEMY_PADDING = 15;

    let player, bullets, enemies, enemyBullets, score, level, gameRunning, keys, enemyDirection, enemySpeed, lastEnemyShot;

    function init() {
      player = {
        x: canvas.width / 2 - PLAYER_WIDTH / 2,
        y: canvas.height - 60,
        width: PLAYER_WIDTH,
        height: PLAYER_HEIGHT
      };
      bullets = [];
      enemies = [];
      enemyBullets = [];
      score = 0;
      level = 1;
      gameRunning = true;
      keys = {};
      enemyDirection = 1;
      enemySpeed = 1;
      lastEnemyShot = 0;

      createEnemies();
      scoreEl.textContent = score;
      levelEl.textContent = level;
      gameOverScreen.style.display = 'none';
    }

    function createEnemies() {
      enemies = [];
      const startX = 50;
      const startY = 50;
      for (let row = 0; row < ENEMY_ROWS; row++) {
        for (let col = 0; col < ENEMY_COLS; col++) {
          enemies.push({
            x: startX + col * (ENEMY_WIDTH + ENEMY_PADDING),
            y: startY + row * (ENEMY_HEIGHT + ENEMY_PADDING),
            width: ENEMY_WIDTH,
            height: ENEMY_HEIGHT,
            alive: true
          });
        }
      }
    }

    // Controles
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        if (gameRunning) shoot();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function shoot() {
      // Limita a quantidade de tiros simultâneos
      if (bullets.length < 4) {
        bullets.push({
          x: player.x + player.width / 2 - BULLET_WIDTH / 2,
          y: player.y,
          width: BULLET_WIDTH,
          height: BULLET_HEIGHT
        });
      }
    }

    function update() {
      if (!gameRunning) return;

      // Movimento do jogador
      if (keys['ArrowLeft'] && player.x > 0) {
        player.x -= PLAYER_SPEED;
      }
      if (keys['ArrowRight'] && player.x + player.width < canvas.width) {
        player.x += PLAYER_SPEED;
      }

      // Atualiza tiros do jogador
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= BULLET_SPEED;
        if (bullets[i].y + bullets[i].height < 0) {
          bullets.splice(i, 1);
        }
      }

      // Movimento dos inimigos
      let hitEdge = false;
      let lowestY = 0;
      enemies.forEach(enemy => {
        if (!enemy.alive) return;
        enemy.x += enemySpeed * enemyDirection;
        if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
          hitEdge = true;
        }
        if (enemy.y + enemy.height > lowestY) {
          lowestY = enemy.y + enemy.height;
        }
      });

      if (hitEdge) {
        enemyDirection *= -1;
        enemies.forEach(enemy => {
          if (enemy.alive) enemy.y += 20;
        });
      }

      // Tiros dos inimigos (aleatório)
      const now = Date.now();
      if (now - lastEnemyShot > 800 - level * 50) {
        const aliveEnemies = enemies.filter(e => e.alive);
        if (aliveEnemies.length > 0) {
          const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
          enemyBullets.push({
            x: shooter.x + shooter.width / 2 - 2,
            y: shooter.y + shooter.height,
            width: 4,
            height: 12
          });
          lastEnemyShot = now;
        }
      }

      // Atualiza tiros inimigos
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        enemyBullets[i].y += 4 + level * 0.5;
        if (enemyBullets[i].y > canvas.height) {
          enemyBullets.splice(i, 1);
        }
      }

      // Colisão: tiro do jogador x inimigo
      for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (!e.alive) continue;
          if (rectsCollide(bullets[i], e)) {
            e.alive = false;
            bullets.splice(i, 1);
            score += 10 * level;
            scoreEl.textContent = score;
            break;
          }
        }
      }

      // Colisão: tiro inimigo x jogador
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        if (rectsCollide(enemyBullets[i], player)) {
          gameOver();
          return;
        }
      }

      // Colisão: inimigo toca o jogador
      for (let e of enemies) {
        if (e.alive && rectsCollide(e, player)) {
          gameOver();
          return;
        }
        // Se os inimigos chegarem muito baixo
        if (e.alive && e.y + e.height >= player.y) {
          gameOver();
          return;
        }
      }

      // Verifica se todos os inimigos foram destruídos
      if (enemies.every(e => !e.alive)) {
        level++;
        levelEl.textContent = level;
        enemySpeed = 1 + level * 0.3;
        createEnemies();
        bullets = [];
        enemyBullets = [];
      }
    }

    function rectsCollide(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }

    function draw() {
      // Fundo
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Estrelas de fundo (simples)
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 50; i++) {
        const x = (i * 97) % canvas.width;
        const y = (i * 53 + Date.now() / 50) % canvas.height;
        ctx.fillRect(x, y, 1, 1);
      }

      if (!gameRunning) return;

      // Jogador (nave)
      ctx.fillStyle = '#0f0';
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width / 4, player.y + player.height - 8);
      ctx.lineTo(player.x + player.width * 3 / 4, player.y + player.height - 8);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      // Tiros do jogador
      ctx.fillStyle = '#0ff';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });

      // Inimigos
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = '#f0f';
        // Corpo
        ctx.fillRect(e.x, e.y + 5, e.width, e.height - 10);
        // "Olhos"
        ctx.fillStyle = '#0f0';
        ctx.fillRect(e.x + 6, e.y + 10, 8, 6);
        ctx.fillRect(e.x + e.width - 14, e.y + 10, 8, 6);
        // Antenas
        ctx.fillStyle = '#f0f';
        ctx.fillRect(e.x + 5, e.y, 4, 8);
        ctx.fillRect(e.x + e.width - 9, e.y, 4, 8);
      });

      // Tiros inimigos
      ctx.fillStyle = '#f00';
      enemyBullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });
    }

    function gameOver() {
      gameRunning = false;
      finalScoreEl.textContent = score;
      gameOverScreen.style.display = 'flex';
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    restartBtn.addEventListener('click', () => {
      init();
    });

    startBtn.addEventListener('click', () => {
      menuScreen.style.display = 'none';
      init();
    });

    menuBtn.addEventListener('click', () => {
      gameOverScreen.style.display = 'none';
      menuScreen.style.display = 'flex';
    });

    // Mostra o menu e inicia o loop (o jogo só começa ao clicar em Iniciar)
    gameRunning = false;
    gameLoop();
  </script>
</body>
</html>
