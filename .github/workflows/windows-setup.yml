name: Gerar Setup Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Setup Windows x64
    runs-on: windows-2025
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador Windows
        run: npm run build:windows

      - name: Publicar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: barretos-clash-windows-${{ github.run_number }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
